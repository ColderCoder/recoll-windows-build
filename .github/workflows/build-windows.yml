name: Build Recoll for Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      recoll_ref:
        description: Recoll branch, tag or commit to build
        required: false
        default: recoll-v1.44.1
        type: string

permissions:
  contents: read

env:
  RECOLL_REPOSITORY: https://framagit.org/medoc92/recoll.git
  RECOLL_REF: ${{ inputs.recoll_ref || 'recoll-v1.44.1' }}
  QT_VERSION: 6.8.2
  VCPKG_COMMIT: 39344dff01c5a5a0134caf2624cdd492f05d30ea

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out build wrapper
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Set up MSYS2 for Aspell
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            make
            perl

      - name: Export MSYS2 location
        shell: pwsh
        run: |
          "MSYS2_LOCATION=${{ steps.msys2.outputs.msys2-location }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up conda-forge Poppler
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: runtime/poppler-environment.yml
          auto-activate-base: false
          auto-update-conda: false
          conda-remove-defaults: true

      - name: Resolve Poppler environment
        shell: pwsh
        run: |
          $condaPath = $null
          if ($env:CONDA_PREFIX -and (Test-Path -LiteralPath $env:CONDA_PREFIX -PathType Container)) {
            $condaPath = $env:CONDA_PREFIX
          }
          $condaCommand = Get-Command conda.exe -ErrorAction SilentlyContinue
          if (-not $condaCommand -and $env:CONDA) {
            foreach ($candidate in @($env:CONDA, (Join-Path $env:CONDA 'conda.exe'))) {
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                $condaCommand = Get-Item -LiteralPath $candidate
                break
              }
            }
          }
          if (-not $condaPath -and $condaCommand) {
            $envList = (& $condaCommand.Source env list --json 2>$null | ConvertFrom-Json).envs
            $condaPath = @($envList | Where-Object { (Split-Path -Leaf $_) -eq 'poppler' }) | Select-Object -First 1
          }
          if (-not $condaPath -or -not (Test-Path -LiteralPath $condaPath -PathType Container)) {
            throw 'Could not locate the conda-forge Poppler environment'
          }
          "POPPLER_ENV_PREFIX=$condaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Poppler environment: $condaPath"

      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg-$env:VCPKG_COMMIT"
          if (-not (Test-Path -LiteralPath (Join-Path $vcpkgRoot 'vcpkg.exe') -PathType Leaf)) {
            if (Test-Path -LiteralPath $vcpkgRoot) {
              Remove-Item -LiteralPath $vcpkgRoot -Recurse -Force
            }
            git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $vcpkgRoot
            git -C $vcpkgRoot checkout --detach $env:VCPKG_COMMIT
            & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed with exit code $LASTEXITCODE" }
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg downloads and installed packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg-${{ env.VCPKG_COMMIT }}/downloads
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Install native dependencies
        shell: pwsh
        run: |
          & (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') install `
            --triplet x64-windows `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --x-install-root="$env:GITHUB_WORKSPACE/vcpkg_installed" `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with exit code $LASTEXITCODE" }

      - name: Save vcpkg cache after dependency installation
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg-${{ env.VCPKG_COMMIT }}/downloads
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Fetch Recoll source and apply Windows build patch
        shell: pwsh
        run: ./scripts/fetch-source.ps1

      - name: Cache runtime downloads
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: build/runtime-downloads
          key: runtime-${{ runner.os }}-${{ hashFiles('runtime/runtime-manifest.json', 'runtime/python-requirements.txt', 'runtime/poppler-environment.yml') }}

      - name: Stage Python, Aspell and Poppler runtimes
        shell: pwsh
        run: ./scripts/stage-runtimes.ps1

      - name: Save runtime download cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/runtime-downloads
          key: runtime-${{ runner.os }}-${{ hashFiles('runtime/runtime-manifest.json', 'runtime/python-requirements.txt', 'runtime/poppler-environment.yml') }}

      - name: Build and package
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: recoll-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
